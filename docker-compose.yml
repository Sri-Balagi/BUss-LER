services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bizos}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bizos}
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      LOG_LEVEL: INFO
      AUTONOMOUS_WORKFLOW_MAX_ITERATIONS: "5"
      ENABLE_AUTONOMOUS_CHECKPOINT_PERSISTENCE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vector-db:
        condition: service_started
    networks:
      - bizos-net

  worker:
    build: .
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.runtime.distributed.celery_app
      - worker
      - --loglevel=info
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bizos}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bizos}
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUTONOMOUS_WORKFLOW_MAX_ITERATIONS: "5"
      ENABLE_AUTONOMOUS_CHECKPOINT_PERSISTENCE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vector-db:
        condition: service_started
    networks:
      - bizos-net

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bizos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-bizos} -d ${POSTGRES_DB:-bizos}
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bizos-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bizos-net

  vector-db:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bizos-net

networks:
  bizos-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
