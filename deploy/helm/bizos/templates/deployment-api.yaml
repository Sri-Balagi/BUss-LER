apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bizos.fullname" . }}-api
  labels:
    app.kubernetes.io/name: bizos-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bizos-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bizos-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: bizos-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bizos.fullname" . }}-config
            - secretRef:
                name: {{ include "bizos.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /api/v1/system/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/system/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
