apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bizos.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: bizos
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | b64enc | quote }}
  SUPABASE_KEY: {{ .Values.secrets.supabaseKey | b64enc | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
